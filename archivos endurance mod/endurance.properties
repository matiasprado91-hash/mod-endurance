# ============================================================
# Endurance System
# ============================================================

# Master switch.
EnduranceEnabled = true

# Maximum endurance of supported equipment.
MaxEndurance = 1000

# Endurance lost per successful weapon attack when the chance succeeds.
EnduranceWeaponLoss = 1

# Percentage chance for weapon endurance loss after a successful attack.
# Valid range: 0-100.
EnduranceWeaponChance = 1

# Endurance lost from each qualifying armor piece when the chance succeeds.
EnduranceArmorLoss = 1

# Percentage chance for armor endurance loss for each equipped armor piece.
# Valid range: 0-100.
EnduranceArmorChance = 10

# Repair cost item ID.
EnduranceRepairItemId = 57

# Base repair cost.
EnduranceRepairBaseCost = 0

# Repair cost per missing endurance point.
EnduranceRepairCostPerPoint = 1
